<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live game · Ubuntu Ultimate</title>
<meta name="description" content="Follow an ultimate frisbee game live, point by point.">
<meta name="theme-color" content="#293750">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1E2A40; --raised: #2A3954; --line: #34435F; --ink: #F4F7F8; --muted: #AEB7C6;
    --brand: #D47D57; --warn: #E8A33D; --danger: #D9472B; --f: #B784D9; --m: #7FA6F0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font-family: Barlow, system-ui, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: #fff; background: var(--danger); padding: 3px 9px; border-radius: 99px; letter-spacing: .1em; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
  .final { background: var(--raised); color: var(--ink); }
  @keyframes pulse { 50% { opacity: .25; } }
  .board { margin-top: 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
  .team { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .team.b { align-items: flex-end; text-align: right; }
  .swatch { width: 36px; height: 6px; border-radius: 3px; }
  .tname { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(20px, 6vw, 28px); line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
  .score { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(64px, 22vw, 112px); line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .meta { margin-top: 10px; color: var(--muted); font-size: 14px; text-align: center; }
  .clock { margin-top: 16px; border-radius: 14px; padding: 14px; text-align: center; background: var(--raised); }
  .clock.timeout { background: var(--warn); color: #1A1200; }
  .clock.halftime { background: #8A3D1F; }
  .clock.late { background: var(--danger); color: #fff; }
  .clock .k { font-weight: 700; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; }
  .clock .t { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(56px, 20vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
  .clock .s { font-weight: 600; opacity: .85; }
  .now { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .chip { font-weight: 700; font-size: 13px; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .chip.F { background: rgba(183,132,217,.18); color: var(--f); }
  .chip.M { background: rgba(127,166,240,.18); color: var(--m); }
  h2 { margin: 26px 0 8px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .pts { border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
  .pt { display: grid; grid-template-columns: 4px 58px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px 10px 0; border-top: 1px solid var(--line); }
  .pt:first-child { border-top: 0; }
  .pt .bar { align-self: stretch; }
  .pt .sc { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; padding-left: 10px; font-variant-numeric: tabular-nums; }
  .pt .who { font-weight: 600; min-width: 0; }
  .pt .who small { display: block; color: var(--muted); font-weight: 400; }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--raised); color: var(--muted); }
  .tag.break { background: rgba(232,163,61,.18); color: var(--warn); }
  .half { padding: 6px 12px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: var(--raised); border-top: 1px solid var(--line); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .foot { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
  .foot b { color: var(--ink); letter-spacing: .14em; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading the game…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Public, read-only view of one game. The publishable key only allows reading public game data;
// names come from person_public, which shows under-18s as first name + initial.
const SUPABASE_URL = 'https://fcsdtbvcvlmspjcfnfto.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SzvG1vyax8_lAiwfxE4xSQ_ozloua85';
const gameId = new URLSearchParams(location.search).get('g');
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clock = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const ratioCode = (r, n) => (r === 'W' || r === 'M') ? `${r === 'W' ? 'F' : 'M'}${n === 1 || n % 2 === 0 ? 1 : 2}` : '';
const DEFAULT_RULES = { pointTarget: 15, halftimeTarget: 8, timeoutSeconds: 75, pullWithinSeconds: 75, halftimeMinutes: 7 };

if (!gameId) {
  app.innerHTML = '<p class="empty">This link is missing a game. Ask the scorer to share the live link from the Ubuntu Ultimate app.</p>';
} else {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  let state = null;
  let loading = false;

  async function load() {
    if (loading) return; loading = true;
    try {
      const { data: game } = await sb.from('game').select('*').eq('id', gameId).maybeSingle();
      if (!game) { app.innerHTML = '<p class="empty">Game not found yet. If it just started, give the scorer’s phone a minute to upload it.</p>'; return; }
      const [teams, points, events, event, venue] = await Promise.all([
        sb.from('team').select('id,name,short_name,primary_color').in('id', [game.team_a_id, game.team_b_id]),
        sb.from('point').select('id,number,half,offense_team_id,scoring_team_id,pulled_at,scored_at,ratio').eq('game_id', gameId).order('number'),
        sb.from('game_event').select('id,point_id,seq,type,team_id,actor_id,secondary_id,value,recorded_at,voided_at').eq('game_id', gameId).is('voided_at', null).order('seq'),
        game.event_id ? sb.from('event').select('name').eq('id', game.event_id).maybeSingle() : Promise.resolve({ data: null }),
        game.venue_id ? sb.from('venue').select('name').eq('id', game.venue_id).maybeSingle() : Promise.resolve({ data: null }),
      ]);
      const ids = [...new Set((events.data || []).flatMap((e) => [e.actor_id, e.secondary_id]).filter(Boolean))];
      const people = ids.length ? (await sb.from('person_public').select('id,first_name,last_name').in('id', ids)).data || [] : [];
      state = { game, teams: teams.data || [], points: points.data || [], events: events.data || [], event: event.data, venue: venue.data, people: new Map(people.map((p) => [p.id, p])) };
      render();
    } finally { loading = false; }
  }

  function render() {
    if (!state) return;
    const { game, teams, points, events, event, venue, people } = state;
    const rules = { ...DEFAULT_RULES, ...(game.rules_json ? JSON.parse(game.rules_json) : {}) };
    const T = (id) => teams.find((t) => t.id === id) || { name: '—', primary_color: '#888' };
    const A = T(game.team_a_id), B = T(game.team_b_id);
    const who = (id) => { const p = people.get(id); return p ? `${p.first_name} ${p.last_name ? p.last_name[0] : ''}`.trim() : ''; };
    let a = 0, b = 0;
    const scored = points.filter((p) => p.scoring_team_id);
    scored.forEach((p) => { if (p.scoring_team_id === game.team_a_id) a++; else b++; });
    if (game.forfeit_team_id) { if (game.forfeit_team_id === game.team_a_id) { a = 0; b = rules.pointTarget; } else { a = rules.pointTarget; b = 0; } }
    const live = game.status === 'live';
    const final = game.status === 'final';
    document.title = `${A.name} ${a}–${b} ${B.name} · ${live ? 'LIVE' : final ? 'Final' : 'Ubuntu Ultimate'}`;

    // The stoppage running now (same rules as the app's sideline clock).
    let clk = '';
    const current = points[points.length - 1];
    const last = events[events.length - 1];
    if (live && current && !current.scored_at) {
      const timeout = last && last.type === 'timeout' && last.point_id === current.id ? last : null;
      const nowMs = Date.now();
      let kind = null, endsAt = 0, team = null;
      if (current.pulled_at) {
        if (timeout) { kind = 'timeout'; team = timeout.team_id; endsAt = Date.parse(timeout.recorded_at) + rules.timeoutSeconds * 1000; }
      } else {
        const prev = points[points.length - 2];
        if (prev && prev.scored_at) {
          const half = events.some((e) => e.point_id === prev.id && e.type === 'halftime');
          const tos = events.filter((e) => e.point_id === current.id && e.type === 'timeout').length;
          const halfEnds = Date.parse(prev.scored_at) + (half ? rules.halftimeMinutes * 60000 : 0);
          const pullDue = halfEnds + (rules.pullWithinSeconds + tos * rules.timeoutSeconds) * 1000;
          if (timeout) { kind = 'timeout'; team = timeout.team_id; endsAt = pullDue; }
          else if (half && nowMs < halfEnds) { kind = 'halftime'; endsAt = halfEnds; }
          else { kind = 'between'; endsAt = pullDue; }
        }
      }
      if (kind) {
        const left = (endsAt - nowMs) / 1000;
        const late = left < 0;
        const title = kind === 'timeout' ? `Timeout · ${esc(T(team).name)}` : kind === 'halftime' ? 'Halftime' : 'Pull in';
        clk = `<div class="clock ${late ? 'late' : kind}"><div class="k">${title}</div><div class="t">${late ? '+' + clock(-left) : clock(Math.ceil(left))}</div><div class="s">${late ? (kind === 'timeout' && current.pulled_at ? 'Back to play' : 'Pull is late') : kind === 'halftime' ? 'Teams are resting' : kind === 'between' ? 'Lines heading out' : 'Play resumes soon'}</div></div>`;
      }
    }

    let nowLine = '';
    if (live && current && current.pulled_at && !current.scored_at && !clk) {
      const turns = events.filter((e) => e.point_id === current.id && ['drop', 'throwaway', 'stall', 'intercept'].includes(e.type)).length;
      const code = ratioCode(current.ratio, current.number);
      nowLine = `<div class="now"><div><b>Point ${current.number} in play</b><br><span style="color:var(--muted)">${esc(T(current.offense_team_id).name)} started on offence${turns ? ` · ${turns} turnover${turns > 1 ? 's' : ''}` : ''}</span></div>${code ? `<span class="chip ${code[0]}">${code}</span>` : ''}</div>`;
    }

    let rows = '';
    let lastHalf = 1;
    let ra = 0, rb = 0;
    const list = scored.map((p) => {
      if (p.scoring_team_id === game.team_a_id) ra++; else rb++;
      const goal = events.find((e) => e.point_id === p.id && (e.type === 'score' || e.type === 'callahan'));
      const isBreak = p.scoring_team_id !== p.offense_team_id;
      return { p, sa: ra, sb: rb, goal, isBreak };
    });
    for (const r of list) {
      if (r.p.half === 2 && lastHalf === 1) { rows += '<div class="half">Second half</div>'; lastHalf = 2; }
      const t = T(r.p.scoring_team_id);
      const g = r.goal;
      const line = g ? (g.type === 'callahan' ? `Callahan · ${esc(who(g.actor_id))}` : g.actor_id ? `${esc(who(g.actor_id))}${g.secondary_id ? ` <small>from ${esc(who(g.secondary_id))}</small>` : ''}` : esc(t.name)) : esc(t.name);
      const code = ratioCode(r.p.ratio, r.p.number);
      rows = `<div class="pt"><div class="bar" style="background:${esc(t.primary_color || '#888')}"></div><div class="sc">${r.sa}–${r.sb}</div><div class="who">${line}<small>${esc(t.name)}${code ? ' · ' + code : ''}</small></div><span class="tag ${r.isBreak ? 'break' : ''}">${r.isBreak ? 'Break' : 'Hold'}</span></div>` + rows;
    }

    const when = game.started_at || game.scheduled_at;
    app.innerHTML = `
      <div class="top"><span>${esc(event ? event.name : 'Game')}</span>${live ? '<span class="live"><i></i>Live</span>' : final ? '<span class="live final">Final</span>' : '<span>Not started</span>'}</div>
      <div class="board">
        <div class="team"><div class="swatch" style="background:${esc(A.primary_color || '#888')}"></div><div class="tname">${esc(A.name)}</div></div>
        <div class="score">${a}<span style="color:var(--muted)">–</span>${b}</div>
        <div class="team b"><div class="swatch" style="background:${esc(B.primary_color || '#888')}"></div><div class="tname">${esc(B.name)}</div></div>
      </div>
      <div class="meta">${[venue ? esc(venue.name) : '', when ? new Date(when).toLocaleString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '', `to ${rules.pointTarget}`].filter(Boolean).join(' · ')}</div>
      ${clk}${nowLine}
      <h2>Point by point</h2>
      <div class="pts">${rows || '<div class="empty">No points yet. Updates appear here as the scorer records them.</div>'}</div>
      <div class="foot"><b>UBUNTU ULTIMATE</b><br>Updates by itself — no need to refresh.<br>Scores come from the scorer’s phone and may lag a few seconds.</div>`;
  }

  load();
  // Live updates, plus a slow poll in case the realtime connection drops.
  sb.channel('game-' + gameId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_event', filter: `game_id=eq.${gameId}` }, () => load())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'point', filter: `game_id=eq.${gameId}` }, () => load())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game', filter: `id=eq.${gameId}` }, () => load())
    .subscribe();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, 20000);
  setInterval(render, 1000); // keeps the countdown ticking
}
</script>
</body>
</html>
